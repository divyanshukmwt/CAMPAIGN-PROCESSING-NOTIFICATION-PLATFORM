<div class="app-shell">
  <mat-toolbar class="app-toolbar" role="banner">
    <div class="toolbar-container">
      <a routerLink="/tasks" class="brand-link" aria-label="Task Management System Home">
        <mat-icon aria-hidden="true">task_alt</mat-icon>
        <span class="brand-title">{{ title() }}</span>
      </a>

      <nav class="toolbar-nav" aria-label="Primary navigation">
        @if (authService.currentUser(); as user) {
          <a
            mat-button
            routerLink="/tasks"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            data-testid="nav-tasks-link"
          >
            <mat-icon aria-hidden="true">view_list</mat-icon>
            <span>Tasks</span>
          </a>
          <a
            mat-flat-button
            routerLink="/tasks/new"
            routerLinkActive="active-link"
            class="new-task-btn"
            data-testid="nav-new-task-link"
          >
            <mat-icon aria-hidden="true">add</mat-icon>
            <span>New Task</span>
          </a>
          <span class="user-chip" data-testid="nav-user-name">
            <mat-icon aria-hidden="true">account_circle</mat-icon>
            <span>{{ user.name }}</span>
          </span>
          <button
            mat-button
            type="button"
            (click)="logout()"
            aria-label="Sign out"
            data-testid="nav-logout-btn"
          >
            <mat-icon aria-hidden="true">logout</mat-icon>
            <span>Logout</span>
          </button>
        } @else {
          <a
            mat-button
            routerLink="/login"
            routerLinkActive="active-link"
            data-testid="nav-login-link"
          >
            <mat-icon aria-hidden="true">login</mat-icon>
            <span>Sign In</span>
          </a>
          <a
            mat-flat-button
            routerLink="/register"
            routerLinkActive="active-link"
            data-testid="nav-register-link"
          >
            <mat-icon aria-hidden="true">person_add</mat-icon>
            <span>Register</span>
          </a>
        }
      </nav>
    </div>
  </mat-toolbar>

  <main class="app-content" role="main">
    <router-outlet />
  </main>

  <footer class="app-footer" role="contentinfo">
    <span>Task Management System &bull; Laravel REST API &amp; Angular Material</span>
  </footer>
</div>
